services:
  - type: web
    name: house-of-play-calendar
    runtime: node
    plan: free
    buildCommand: npm install && npx playwright install --with-deps chromium && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: CRAWL_WEEKS
        value: 12
      - key: HOUSE_OF_PLAY_CALENDAR
        value: https://www.houseofplay.dk/calendar
